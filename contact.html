<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | RideNest</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <!-- Navbar -->
    <div class="navbar-container">
        <h2 class="brand">RideNest</h2>

        <ul class="navbar">
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </div>

    <!-- Contact Section -->
    <section class="contact-section">
        <p class="section-tag">WE ARE HERE TO HELP</p>
        <h1>Contact RideNest</h1>
        <p>Have a question or suggestion? Send us a message.</p>

        <form class="contact-form">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Enter subject" required>

            <label for="message">Message</label>
            <textarea id="message" rows="5"
                placeholder="Write your message..." required></textarea>

            <button type="submit">Send Message</button>    
        
        </form>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <h2>RideNest</h2>
        <p>Student-focused travel, made simple.</p>
    </footer>

</body>
</html>
