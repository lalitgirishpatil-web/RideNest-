<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RideNest</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="navbar-container">
        <h2 class="brand">RideNest</h2>
        <ul class="navbar">
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </div>

    <section class="login-section">
        <div class="login-card">
            <p class="section-tag">WELCOME BACK</p>
            <h1>Login to RideNest</h1>
            <p class="login-description">
                Sign in to make your next journey easier.
            </p>

            <form class="login-form">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>

            <p class="signup-text">
                New to RideNest? <a href="#">Create an account</a>
            </p>
        </div>
    </section>

    <footer class="site-footer">
        <h2>RideNest</h2>
        <p>Student-focused travel, made simple.</p>
    </footer>

    <script src="login.js"></script>
</body>
</html>
